name: Dependency lock generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/dependency-lock.yml

permissions:
  contents: read

jobs:
  generate-lock:
    name: Generate Python 3.14 lock (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned lock resolver
        run: |
          python -m pip install "pip==25.3"
          python -m pip install "pip-tools==7.5.2"

      - name: Resolve production and development locks with hashes
        shell: bash
        run: |
          mkdir -p generated-locks
          pip-compile --no-config --index-url=https://pypi.org/simple --emit-index-url --resolver=backtracking --generate-hashes --allow-unsafe --strip-extras \
            --output-file="generated-locks/requirements-${{ matrix.platform }}-py314.lock" \
            requirements.txt
          pip-compile --no-config --index-url=https://pypi.org/simple --emit-index-url --resolver=backtracking --generate-hashes --allow-unsafe --strip-extras \
            --output-file="generated-locks/requirements-dev-${{ matrix.platform }}-py314.lock" \
            requirements.txt requirements-dev.txt

      - name: Verify clean hash-locked installations
        shell: bash
        run: |
          python -m venv .venv-lock-prod
          python -m venv .venv-lock-dev
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PROD_PYTHON=".venv-lock-prod/Scripts/python.exe"
            DEV_PYTHON=".venv-lock-dev/Scripts/python.exe"
          else
            PROD_PYTHON=".venv-lock-prod/bin/python"
            DEV_PYTHON=".venv-lock-dev/bin/python"
          fi
          "$PROD_PYTHON" -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r "generated-locks/requirements-${{ matrix.platform }}-py314.lock"
          "$DEV_PYTHON" -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r "generated-locks/requirements-dev-${{ matrix.platform }}-py314.lock"

      - name: Record resolver environment
        shell: bash
        run: |
          python -VV > generated-locks/resolver-environment.txt
          python -m pip --version >> generated-locks/resolver-environment.txt
          pip-compile --version >> generated-locks/resolver-environment.txt
          python -c "import platform; print(platform.platform()); print(platform.machine())" >> generated-locks/resolver-environment.txt
          echo "platform=${{ matrix.platform }}" >> generated-locks/resolver-environment.txt
          echo "python=3.14" >> generated-locks/resolver-environment.txt
          echo "pip=25.3" >> generated-locks/resolver-environment.txt
          echo "pip-tools=7.5.2" >> generated-locks/resolver-environment.txt

      - name: Upload generated lock candidates
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-candidates-${{ matrix.platform }}-py314
          path: generated-locks/
          if-no-files-found: error
          retention-days: 14

  commit-locks:
    name: Commit validated platform lock files
    needs: generate-lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux lock artifact
        uses: actions/download-artifact@v4
        with:
          name: dependency-lock-candidates-linux-py314
          path: artifacts/linux

      - name: Download Windows lock artifact
        uses: actions/download-artifact@v4
        with:
          name: dependency-lock-candidates-windows-py314
          path: artifacts/windows

      - name: Stage validated lock files
        run: |
          cp artifacts/linux/requirements-linux-py314.lock .
          cp artifacts/linux/requirements-dev-linux-py314.lock .
          cp artifacts/windows/requirements-windows-py314.lock .
          cp artifacts/windows/requirements-dev-windows-py314.lock .
          git add requirements-*-py314.lock requirements-dev-*-py314.lock

      - name: Commit locks to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --cached --quiet; then
            echo "Lock files are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add verified Python 3.14 dependency locks"
          git push origin HEAD:main
