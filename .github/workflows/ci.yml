name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders: tests must use mocks and must never call a live provider.
      DEFAULT_PROVIDER: agnes
      DEFAULT_MODEL: ci-test-model
      AGNES_API_KEY: ci-placeholder-not-a-secret
      AGNES_BASE_URL: https://ci.invalid/v1
      AGNES_MODEL: ci-test-model
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r requirements-dev-linux-py314.lock

      - name: Full regression suite
        run: python -m pytest -q

      - name: Security regression suite
        if: always()
        run: python tools/run_security_regression.py

  coverage-baseline:
    name: Coverage baseline (Python 3.14)
    # Keep coverage instrumentation away from timing-sensitive regression
    # contracts; the security regression suite contains throughput checks.
    needs: regression
    runs-on: ubuntu-latest
    env:
      DEFAULT_PROVIDER: agnes
      DEFAULT_MODEL: ci-test-model
      AGNES_API_KEY: ci-placeholder-not-a-secret
      AGNES_BASE_URL: https://ci.invalid/v1
      AGNES_MODEL: ci-test-model
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked development dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r requirements-dev-linux-py314.lock

      - name: Collect line and branch coverage baseline
        shell: bash
        run: |
          test_status=0
          coverage run --branch --source=agents,core,integration,runtime,security,tools --omit=tools/check_coverage_thresholds.py,tools/check_trivy_license_policy.py,tools/check_osv_db_freshness.py -m pytest -q \
            --ignore=tests/test_large_project_benchmark.py \
            --ignore=tests/test_multi_developer_benchmark.py \
            --ignore=tests/test_real_developer_ab_benchmark.py \
            --ignore=tests/test_real_developer_benchmark_parallelism.py \
            --ignore=tests/test_workflow_event_performance_contract.py \
            --ignore=tests/test_workflow_event_performance_regression_contract.py || test_status=$?
          coverage json --pretty-print -o coverage.json
          coverage html -d coverage-html
          coverage report -m
          python tools/check_coverage_thresholds.py coverage.json config/coverage_thresholds.json
          printf 'python=%s\n' "$(python --version)" > coverage-baseline-metadata.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> coverage-baseline-metadata.txt
          printf 'measurement=branch-and-line\n' >> coverage-baseline-metadata.txt
          printf 'excluded=machine-sensitive benchmark/performance timing tests and CI-only helper scripts (check_coverage_thresholds.py, check_trivy_license_policy.py, check_osv_db_freshness.py)\n' >> coverage-baseline-metadata.txt
          exit "$test_status"

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-python314
          path: |
            coverage.json
            coverage-html/
            coverage-baseline-metadata.txt
          if-no-files-found: warn
          retention-days: 30

  windows-toolchain-smoke:
    runs-on: windows-latest
    env:
      DEFAULT_PROVIDER: agnes
      DEFAULT_MODEL: ci-test-model
      AGNES_API_KEY: ci-placeholder-not-a-secret
      AGNES_BASE_URL: https://ci.invalid/v1
      AGNES_MODEL: ci-test-model
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r requirements-dev-windows-py314.lock

      - name: Production Windows Python and Node.js adapter E2E
        env:
          AI_TEAM_E2E_EVIDENCE_DIR: "${{ runner.temp }}/ai-team-e2e-evidence"
        run: python -m pytest -q tests/test_project_adapter_windows_e2e.py tests/test_project_adapter_node_e2e.py

      - name: Upload machine-readable project E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-e2e-evidence
          path: "${{ runner.temp }}/ai-team-e2e-evidence/*.json"
          if-no-files-found: warn
          retention-days: 30

  router-image-smoke:
    name: Host Router image build and immutable verification (Docker Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build and verify via production Host manager against Docker Engine
        run: |
          python - <<'PY'
          from pathlib import Path
          from runtime.local_docker_provider import LocalDockerProvider
          from runtime.local_docker_router_image import LocalDockerRouterImageManager

          result = LocalDockerRouterImageManager(
              LocalDockerProvider(), Path.cwd()
          ).build_and_verify()
          if result.status != "verified" or result.identity is None:
              raise SystemExit(
                  f"Router image build/verification failed: {result.status}: {result.detail}"
              )
          print(f"Verified immutable Router image ID: {result.identity.image_id}")
          print(f"Platform: {result.identity.operating_system}/{result.identity.architecture}")
          print(f"HAProxy: {result.identity.haproxy_version}")
          print(f"socat: {result.identity.socat_package_version}")

          from tempfile import TemporaryDirectory
          from runtime.deployment_traffic_router import TrafficPortBinding, TrafficRouterScope
          from runtime.local_docker_router_state import LocalDockerRouterStateStore
          from runtime.local_docker_router_config_validator import LocalDockerRouterConfigValidator

          with TemporaryDirectory(prefix="ai-team-router-config-check-") as temp_dir:
              state_result = LocalDockerRouterStateStore(Path(temp_dir) / "state").persist(
                  TrafficRouterScope("docker-local", "ci-router-config", "syntax-check"),
                  (TrafficPortBinding(18080, 80), TrafficPortBinding(18443, 443)),
              )
              if state_result.status != "persisted" or state_result.record is None:
                  raise SystemExit(f"Router config state preparation failed: {state_result.status}: {state_result.detail}")
              provider = LocalDockerProvider()
              config_result = LocalDockerRouterConfigValidator(provider).validate(
                  result.identity, state_result.record,
              )
              if config_result.status != "valid":
                  raise SystemExit(f"HAProxy generated-config syntax validation failed: {config_result.status}: {config_result.detail}")
              print("PASS: generated HAProxy config and active map accepted by pinned HAProxy -c")
          PY

      - name: Live Router bootstrap and Runtime API read-back
        env:
          AI_TEAM_ROUTER_EVIDENCE_PATH: ${{ runner.temp }}/ai-team-router-live-smoke.json
        run: python -m scripts.local_docker_router_live_smoke

      - name: Upload live Router bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-live-bootstrap-evidence
          path: "${{ runner.temp }}/ai-team-router-live-smoke.json"
          if-no-files-found: warn
          retention-days: 30

      - name: Live routed-app, active Router slot switch, and TCP route marker
        env:
          AI_TEAM_ROUTED_APP_EVIDENCE_PATH: ${{ runner.temp }}/ai-team-routed-app-live-smoke.json
        run: python -m scripts.local_docker_routed_app_live_smoke

      - name: Upload live routed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routed-app-live-smoke-evidence
          path: "${{ runner.temp }}/ai-team-routed-app-live-smoke.json"
          if-no-files-found: warn
          retention-days: 30
