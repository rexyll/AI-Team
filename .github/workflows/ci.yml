name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders: tests must use mocks and must never call a live provider.
      DEFAULT_PROVIDER: agnes
      DEFAULT_MODEL: ci-test-model
      AGNES_API_KEY: ci-placeholder-not-a-secret
      AGNES_BASE_URL: https://ci.invalid/v1
      AGNES_MODEL: ci-test-model
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r requirements-dev-linux-py314.lock

      - name: Full regression suite
        run: python -m pytest -q

      - name: Security regression suite
        if: always()
        run: python tools/run_security_regression.py

  windows-toolchain-smoke:
    runs-on: windows-latest
    env:
      DEFAULT_PROVIDER: agnes
      DEFAULT_MODEL: ci-test-model
      AGNES_API_KEY: ci-placeholder-not-a-secret
      AGNES_BASE_URL: https://ci.invalid/v1
      AGNES_MODEL: ci-test-model
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --require-hashes -r requirements-dev-windows-py314.lock

      - name: Production Windows terminal adapter smoke
        run: python -m pytest -q tests/test_project_adapter_windows_e2e.py
