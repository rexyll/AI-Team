name: SCM live read-only smoke

on:
  # Revalidate live PR metadata and CI/review evidence whenever the read-only
  # probe definition or its SCM adapter implementation changes on main.
  push:
    branches: [main]
    paths:
      - .github/workflows/scm-live-readonly-smoke.yml
      - runtime/github_scm_provider.py
      - runtime/scm_provider.py
      - scripts/scm_live_readonly_smoke.py
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Existing pull request number to inspect
        required: false
        default: "2"
        type: string

# The automatically-issued token is limited to read-only repository evidence.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_TEAM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_TEAM_GITHUB_REPOSITORY: ${{ github.repository }}
      AI_TEAM_GITHUB_PULL_REQUEST: ${{ inputs.pull_request_number || '2' }}
      AI_TEAM_GITHUB_CI_PROBE_SHA: 4d5604a54d21c7389d0c5d93079b31aba958c698
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect live PR, CI, review and Check Run-only aggregation
        run: python -m scripts.scm_live_readonly_smoke
