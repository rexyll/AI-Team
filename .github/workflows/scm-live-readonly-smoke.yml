name: SCM live read-only smoke

on:
  # Revalidate live draft metadata and bounded CI/review pagination after the 2026-11-16 SCM hardening.
# A one-shot live read-only probe also runs when this workflow definition
  # changes on main. The path filter prevents routine application pushes from
  # repeatedly probing the same historical PR.
  push:
    branches: [main]
    paths:
      - .github/workflows/scm-live-readonly-smoke.yml
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Existing pull request number to inspect
        required: false
        default: "2"
        type: string

# The automatically-issued token is limited to read-only repository evidence.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_TEAM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_TEAM_GITHUB_REPOSITORY: ${{ github.repository }}
      AI_TEAM_GITHUB_PULL_REQUEST: ${{ inputs.pull_request_number || '2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect live PR, CI and review evidence
        run: python -m scripts.scm_live_readonly_smoke
